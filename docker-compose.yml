version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: golf_charity_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-system}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-system}
      POSTGRES_DB: ${DB_NAME:-golf_charity}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-system} -d ${DB_NAME:-golf_charity}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
    driver: local
